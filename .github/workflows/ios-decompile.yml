name: ios-decompile
# iOS 27 GenerativeAgents (MCP) cercevesini bulut macOS'ta ayiklayip sembol/sinif dokumu cikarir.
# Salt okuma/analiz; kullanici cihazina indirme YOK (firmware bulutta iner). ipsw = blacktop/ipsw.
on:
  push:
    paths:
      - '.github/workflows/ios-decompile.yml'
  workflow_dispatch:
    inputs:
      cihaz:
        description: "cihaz (iPhone17,5 = iPhone 16e)"
        default: "iPhone17,5"
      surum:
        description: "iOS surumu"
        default: "27.0"
      cerceve:
        description: "ayiklanacak cerceve adi"
        default: "GenerativeAgents"
jobs:
  decompile:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: ipsw kur
        run: |
          brew install ipsw || brew install blacktop/tap/ipsw
          ipsw version
      - name: Firmware indir + shared cache ayikla
        run: |
          set -x
          ipsw download ipsw --device "${{ inputs.cihaz || 'iPhone17,5' }}" --version "${{ inputs.surum || '27.0' }}" --dyld --confirm
          echo "=== inen dosyalar ==="
          ls -la
          find . -maxdepth 3 -iname "dyld_shared_cache*" | tee caches.txt
      - name: Cerceveyi ayikla
        run: |
          set -x
          CACHE=$(find . -iname "dyld_shared_cache_arm64e" | head -1)
          [ -z "$CACHE" ] && CACHE=$(find . -iname "dyld_shared_cache_arm64*" | grep -v '\.' | head -1)
          echo "cache: $CACHE"
          mkdir -p out
          ipsw dyld extract "$CACHE" "${{ inputs.cerceve || 'GenerativeAgents' }}" --output out || \
          ipsw dyld extract "$CACHE" "/System/Library/PrivateFrameworks/${{ inputs.cerceve || 'GenerativeAgents' }}.framework/${{ inputs.cerceve }}" --output out
          echo "=== cikan ==="
          find out -type f | tee extracted.txt
          DYLIB=$(find out -type f -name "${{ inputs.cerceve || 'GenerativeAgents' }}" | head -1)
          echo "DYLIB=$DYLIB" >> $GITHUB_ENV
          echo "CACHE=$CACHE" >> $GITHUB_ENV
      - name: Macho bilgi + cache class-dump + stringler
        run: |
          set -x
          D="$DYLIB"; C="$CACHE"
          echo "### macho info" > analiz.txt
          ipsw macho info "$D" 2>&1 | head -60 >> analiz.txt || true
          # class-dump DOGRUDAN shared cache'ten (tipler cozulur)
          ipsw class-dump "$C" GenerativeAgents 2>/dev/null > classdump.txt ||           ipsw dyld class-dump "$C" GenerativeAgents 2>/dev/null > classdump.txt ||           ipsw class-dump --cache "$C" "$D" 2>/dev/null > classdump.txt || true
          echo "### classdump satir sayisi" >> analiz.txt; wc -l classdump.txt >> analiz.txt
          echo "### classdump MCP/tool/config/server bolumleri" >> analiz.txt
          grep -inE "mcp|tool|mcpservers|serverconfig|transport|jsonrpc|register|entitlement" classdump.txt | head -400 >> analiz.txt
          # TUM stringler + yapilandirma/dosya yolu ipuclari
          strings -a "$D" > tum_stringler.txt || true
          echo "### mcpServers / config / plist / path baglami" >> analiz.txt
          grep -inE "mcpservers|mcp.?server.?config|\.plist|\.json|/Library/|/var/|/private/|preferences|defaults|UserDefaults|configuration|config file|load.*config" tum_stringler.txt | head -200 >> analiz.txt
          echo "### MCP ile ilgili tum stringler" >> analiz.txt
          grep -iE "mcp|modelcontext|jsonrpc|tools/(call|list)|resources/|prompts/" tum_stringler.txt | sort -u | head -200 >> analiz.txt
          # cache'ten GenerativeAgents export sembolleri + demangle
          ipsw dyld symaddr "$C" --image GenerativeAgents 2>/dev/null | head -50 >> analiz.txt || true
          ipsw dyld a2s "$C" 2>/dev/null | head -1 >/dev/null || true
      - name: Sonuclari yukle
        uses: actions/upload-artifact@v4
        with:
          name: ios-decompile
          path: |
            analiz.txt
            demangled.txt
            classdump.txt
            extracted.txt
            tum_stringler.txt
          if-no-files-found: warn
